name: ${COMPOSE_PROJECT_NAME:-idp}

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  logging: &logging
    driver: local
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    networks: [backend]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: idp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idp_db"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    logging: *logging

  cache:
    <<: *hardening
    image: ${REDIS_IMAGE:-redis:8.10.3-bookworm}
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks: [backend]
    ports:
      - "6379:6379"
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits: { memory: 256M }

  tempo:
    <<: *hardening
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    networks: [backend, frontend]
    ports:
      - "3200:3200"
    tmpfs: [/tmp]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M }

  loki:
    <<: *hardening
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks: [backend, frontend]
    ports:
      - "3100:3100"
    tmpfs: [/tmp]
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M }

  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/tmp/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    networks: [backend, frontend]
    ports:
      - "9090:9090"
    tmpfs: [/tmp]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 512M }

  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      tempo: { condition: service_healthy }
    networks: [backend, frontend]
    ports:
      - "4317:4317"
      - "4318:4318"
    tmpfs: [/tmp]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "healthcheck", "--endpoint=http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits: { memory: 256M }

  grafana:
    <<: *hardening
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    networks: [frontend, backend]
    depends_on:
      prometheus: { condition: service_healthy }
      tempo:      { condition: service_healthy }
      loki:       { condition: service_healthy }
    tmpfs: [/tmp]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M }

  proxy:
    <<: *hardening
    image: ${CADDY_IMAGE:-caddy:2.9-alpine}
    ports: ["8080:8080"]
    networks: [frontend, backend]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    tmpfs: [/config, /tmp]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  frontend: {}
  backend:
    internal: false
  egress: {}

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-idp}_pgdata
  caddy_data: {}

secrets:
  db_password:
    file: ${SECRETS_DIR:-/tmp}/db_password.txt
