extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  postgresql:
    endpoint: db:5432
    transport: tcp
    username: postgres
    password: postgres_dev_password_123
    databases:
      - idp_db
    collection_interval: 15s
    tls:
      insecure: true

  redis:
    endpoint: cache:6379
    collection_interval: 15s

processors:
  batch:
    timeout: 1s
    send_batch_size: 256
  attributes:
    actions:
      - key: service.name
        action: insert
        value: "internal-developer-platform"
      - key: loki.resource.labels
        action: insert
        value: "service.name, environment"

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel
  logging:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, logging]
    logs:
      receivers: [otlp]
      processors: [attributes, batch]
      exporters: [otlphttp/loki, logging]
    metrics:
      receivers: [otlp, postgresql, redis]
      processors: [batch]
      exporters: [prometheus, logging]
