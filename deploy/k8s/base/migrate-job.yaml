apiVersion: batch/v1
kind: Job
metadata:
  name: platform-migrate
  labels:
    app.kubernetes.io/name: platform-migrate
    app.kubernetes.io/part-of: developer-platform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-migrate
        app.kubernetes.io/part-of: developer-platform
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/scaibu/platform-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/platform-svc", "migrate"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: internal-developer-platform-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: db_password
            - name: DATABASE_URL
              value: postgres://postgres:$(DB_PASSWORD)@db:5432/idp_db?sslmode=disable
          resources:
            limits:
              cpu: "500m"
              memory: 256Mi
            requests:
              cpu: "50m"
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
