apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-worker
  labels:
    app.kubernetes.io/name: rust-worker
    app.kubernetes.io/part-of: developer-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-worker
        app.kubernetes.io/part-of: developer-platform
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rust-worker
          image: ghcr.io/scaibu/rust-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: 9000
              protocol: TCP
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: db_password
            - name: DATABASE_URL
              value: postgres://postgres:$(DB_PASSWORD)@db:5432/idp_db?sslmode=disable
          resources:
            limits:
              cpu: "1000m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["/app/service-bin", "healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/app/service-bin", "healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rust-worker
  labels:
    app.kubernetes.io/name: rust-worker
    app.kubernetes.io/part-of: developer-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rust-worker
  ports:
    - name: grpc
      port: 9000
      targetPort: grpc
      protocol: TCP
