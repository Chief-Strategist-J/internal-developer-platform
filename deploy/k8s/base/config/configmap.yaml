apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-developer-platform-config
  labels:
    app.kubernetes.io/name: internal-developer-platform
    app.kubernetes.io/part-of: developer-platform
data:
  APP_ENV: "production"
  PORT: "8080"
  ADMIN_PORT: "8081"
  METRICS_PORT: "9090"
  LOG_LEVEL: "info"
  DATABASE_URL: "postgres://postgres:postgres_dev_password_123@postgres:5432/idp_db?sslmode=disable"
  REDIS_ADDR: "redis:6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
