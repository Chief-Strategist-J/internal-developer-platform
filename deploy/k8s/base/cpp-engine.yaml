apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpp-engine
  labels:
    app.kubernetes.io/name: cpp-engine
    app.kubernetes.io/part-of: developer-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpp-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpp-engine
        app.kubernetes.io/part-of: developer-platform
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cpp-engine
          image: ghcr.io/scaibu/cpp-engine:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: internal-developer-platform-config
          resources:
            limits:
              cpu: "2000m"
              memory: 1Gi
            requests:
              cpu: "200m"
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["/app/service-bin", "healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/app/service-bin", "healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cpp-engine
  labels:
    app.kubernetes.io/name: cpp-engine
    app.kubernetes.io/part-of: developer-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cpp-engine
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
