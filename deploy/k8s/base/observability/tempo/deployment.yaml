apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: dev
  labels:
    app.kubernetes.io/name: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/tempo.yaml
          ports:
            - name: http
              containerPort: 3200
          resources:
            limits:
              cpu: "1000m"
              memory: 1Gi
            requests:
              cpu: "200m"
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo.yaml
              subPath: tempo.yaml
      volumes:
        - name: config
          configMap:
            name: tempo-config
