apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: dev
  labels:
    app.kubernetes.io/name: prometheus
data:
  self-service-provisioning.rules.yaml: |
    groups:
      - name: self-service-provisioning.rules
        rules:
          - alert: SSPOrphanedDirtyDetected
            expr: ssp_sweeper_orphaned_dirty_count > 0
            for: 15m
            labels:
              severity: page
              team: platform
              tier: tier-1
            annotations:
              summary: "Orphaned dirty resource detected during provisioning compensation"
              description: "Saga compensation failed on one or more resources. Requires two-person manual completion runbook."
              runbook_url: "docs/features/self-service-provisioning/failure-cases.md#runbook-orphaned-dirty"

          - alert: SSPDuplicateResourceDetected
            expr: ssp_sweeper_duplicates_count > 0
            for: 5m
            labels:
              severity: page
              team: platform
              tier: tier-1
            annotations:
              summary: "Duplicate resources detected for request key"
              description: "Duplicate scan found >1 resource per (request, step, type). Freeze step type and quarantine extras."
              runbook_url: "docs/features/self-service-provisioning/failure-cases.md#runbook-duplicate-resources"

          - alert: SSPSagaStallDetected
            expr: ssp_saga_stalled_count > 0
            for: 30m
            labels:
              severity: page
              team: platform
              tier: tier-1
            annotations:
              summary: "Provisioning saga stalled beyond threshold"
              description: "One or more active sagas have not advanced state for >30 minutes. Check workflow engine or ledger connection."
              runbook_url: "docs/features/self-service-provisioning/failure-cases.md#runbook-saga-stall"

          - alert: SSPIPSpaceNearExhaustion
            expr: (ssp_ip_cidr_allocated_count / ssp_ip_cidr_total_capacity) > 0.90
            for: 10m
            labels:
              severity: page
              team: platform
              tier: tier-1
            annotations:
              summary: "IP space quota utilization exceeds 90%"
              description: "Subnet CIDR pool is nearing exhaustion. Provision additional address space before new clusters fail."

          - alert: SSPDataClassDeletionWithoutDecision
            expr: ssp_retention_unauthorized_deletion_attempts_total > 0
            for: 0m
            labels:
              severity: page
              team: security
              tier: tier-1
            annotations:
              summary: "Data-bearing resource deletion attempted without retention decision"
              description: "Attempted teardown of data-bearing resource violating INV-06 without owner retention record."

          - alert: SSPDanglingDNSDetected
            expr: ssp_sweeper_dangling_dns_count > 0
            for: 15m
            labels:
              severity: page
              team: security
              tier: tier-1
            annotations:
              summary: "Dangling DNS record found during cooldown audit"
              description: "Decommissioned DNS record is still resolving or was reclaimed before cooldown expiry (INV-07)."

          - alert: SSPSecretsInRepositoryDetected
            expr: ssp_repo_secret_scan_violations_total > 0
            for: 0m
            labels:
              severity: page
              team: security
              tier: tier-1
            annotations:
              summary: "Plaintext secrets detected in newly scaffolded repository"
              description: "INV-13 scanner flagged private keys or hardcoded tokens in manifest repository."

          - alert: SSPTenantQuotaDrift
            expr: (ssp_tenant_quota_units_used / ssp_tenant_quota_units_limit) > 0.85
            for: 30m
            labels:
              severity: ticket
              team: platform
            annotations:
              summary: "Tenant capacity approaching quota ceiling"
              description: "Tenant capacity usage is above 85% of assigned ceiling. Trigger tenant capacity review."

          - alert: SSPReadyWithoutReplicas
            expr: ssp_observed_ready_no_healthy_replicas > 0
            for: 10m
            labels:
              severity: ticket
              team: owners
            annotations:
              summary: "Resource reported READY but zero healthy endpoints observed"
              description: "INV-12 observed READY gate flagged missing active pods or endpoint reachability."
  autoscaling.rules.yaml: |
    groups:
    - name: autoscaling.rules
      rules:
      - alert: DatabaseConnectionsExhaustionApproaching
        expr: max by (database_id) (cloudsql_googleapis_com:database_postgresql_num_backends)
          > scalar(autoscaling_cfg_threshold{name="db_conn_page"})
        for: 5m
        labels:
          severity: page
          team: platform
          tier: tier-1
        annotations:
          summary: Database connections approaching the connection budget during pod scale-out
          description: Active PostgreSQL connections exceed cfg.db.conn_page. Pod scale-out
            multiplies connections (AS-INV-16).
          runbook_url: docs/features/autoscaling/failure-cases.md#runbook-db-connection-exhaustion
      - alert: KafkaConsumerLagCritical
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > scalar(autoscaling_cfg_threshold{name="kafka_lag_critical"})
        for: 15m
        labels:
          severity: page
          team: data-platform
          tier: tier-1
        annotations:
          summary: Kafka consumer lag is critical; check whether replicas are capped at
            the partition count
          description: Lag exceeds cfg.ingest.lag_critical. Consumers cannot scale past
            the partition count (AS-INV-19).
          runbook_url: docs/features/autoscaling/failure-cases.md#runbook-kafka-partition-lag
      - alert: AutoscalingThresholdConfigMissing
        expr: absent(autoscaling_cfg_threshold{name="db_conn_page"}) or absent(autoscaling_cfg_threshold{name="kafka_lag_critical"})
        for: 10m
        labels:
          severity: ticket
          team: platform
          tier: tier-1
        annotations:
          summary: Autoscaling alert thresholds are not published
          description: autoscaling_cfg_threshold series are missing, so the connection
            and lag alerts cannot fire. Platform must publish the cfg.* values.
          runbook_url: docs/features/autoscaling/failure-cases.md#runbook-db-connection-exhaustion
  deployment-strategies.rules.yaml: |
    groups:
      - name: deployment-strategies.rules
        rules:
          - alert: CanaryPreTrafficHealthFailure
            expr: sum by (tenant_id, workload_id) (rate(platform_rollout_pretraffic_failures_total[5m])) > 0
            for: 1m
            labels:
              severity: warning
              team: platform
              tier: tier-1
            annotations:
              summary: Canary pods unready before traffic shift (Invariant P0-03 breach)
              description: Traffic shifting attempted before canary replicas reached healthy state or sidecar injection.
              runbook_url: docs/features/deployment-strategies/failure-cases.md#runbook-canary-pretraffic-failure
          - alert: CanaryRolloutAbortedOnMetricBreach
            expr: sum by (tenant_id, workload_id) (rate(platform_rollout_aborts_total{reason="metric_breach"}[5m])) > 0
            for: 1m
            labels:
              severity: page
              team: platform
              tier: tier-1
            annotations:
              summary: Progressive rollout aborted due to metric SLO breach (Invariant P0-04)
              description: Canary analysis detected error rate or latency exceeding threshold. Traffic weight rolled back to 0%.
              runbook_url: docs/features/deployment-strategies/failure-cases.md#runbook-canary-metric-abort
          - alert: RolloutMeshWeightDesynchronized
            expr: abs(platform_mesh_traffic_weight_actual - platform_mesh_traffic_weight_target) > 5
            for: 3m
            labels:
              severity: page
              team: platform
              tier: tier-1
            annotations:
              summary: Service Mesh traffic weight desynchronized from rollout ledger (EC-03)
              description: Cloud Service Mesh actual weight differs from the rollout ledger state by more than 5%.
              runbook_url: docs/features/deployment-strategies/failure-cases.md#runbook-mesh-weight-desync
