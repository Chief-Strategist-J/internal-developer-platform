apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dev
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - "/etc/prometheus/rules/*.yaml"
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: "otel-collector"
        static_configs:
          - targets: ["otel-collector:8889"]
