apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - datasources-configmap.yaml
  - dashboards-provider-configmap.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/self-service-provisioning.json
    options:
      disableNameSuffixHash: true
