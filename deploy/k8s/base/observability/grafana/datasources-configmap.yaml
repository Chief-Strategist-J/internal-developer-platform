apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: dev
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.dev.svc:9090
        isDefault: true
        editable: false

      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.dev.svc:3200
        isDefault: false
        editable: false
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          search:
            hide: false

      - name: Loki
        type: loki
        access: proxy
        url: http://loki.dev.svc:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: "traceId: ([0-9a-f]{32})"
              name: TraceID
              url: '$${__value.raw}'
