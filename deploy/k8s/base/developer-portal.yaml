apiVersion: apps/v1
kind: Deployment
metadata:
  name: developer-portal
  labels:
    app.kubernetes.io/name: developer-portal
    app.kubernetes.io/part-of: developer-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: developer-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: developer-portal
        app.kubernetes.io/part-of: developer-platform
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: developer-portal
          image: ghcr.io/scaibu/developer-portal:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: BACKEND_URL
              value: http://platform-api:8080
          resources:
            limits:
              cpu: "1000m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: developer-portal
  labels:
    app.kubernetes.io/name: developer-portal
    app.kubernetes.io/part-of: developer-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: developer-portal
  ports:
    - name: http
      port: 7007
      targetPort: http
      protocol: TCP
