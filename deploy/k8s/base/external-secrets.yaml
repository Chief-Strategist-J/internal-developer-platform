apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: my-idp-prod-project
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-credentials
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: developer-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: platform-credentials
    creationPolicy: Owner
  data:
    - secretKey: db_password
      remoteRef:
        key: internal-developer-platform-prod-db-password
