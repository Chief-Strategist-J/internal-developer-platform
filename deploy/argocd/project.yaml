apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: internal-developer-platform
  namespace: argocd
spec:
  description: Internal Developer Platform Workloads Project
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
