apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-root-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: internal-developer-platform
  source:
    repoURL: https://github.com/Chief-Strategist-J/internal-developer-platform.git
    targetRevision: HEAD
    path: deploy/argocd/applications/core
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
