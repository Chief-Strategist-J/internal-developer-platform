replicaCount: 2

image:
  repository: ghcr.io/scaibu/platform-api
  pullPolicy: IfNotPresent
  tag: "1.0.0"

portalImage:
  repository: ghcr.io/scaibu/developer-portal
  pullPolicy: IfNotPresent
  tag: "1.0.0"

serviceAccount:
  create: true
  name: "idp-platform-sa"
  annotations:
    iam.gke.io/gcp-service-account: "internal-developer-platform-workload@my-idp-prod.iam.gserviceaccount.com"

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  httpPort: 8080
  metricsPort: 9090
  portalPort: 7007

ingress:
  enabled: true
  className: "istio"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: idp.internal.company.com
      paths:
        - path: /api/v1
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: portal
  tls:
    - secretName: idp-tls-cert
      hosts:
        - idp.internal.company.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

env:
  APP_ENV: production
  LOG_LEVEL: info

kyverno:
  enabled: true
