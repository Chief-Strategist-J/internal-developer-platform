name: CI — Deployment Strategies

on:
  push:
    branches: [main]
    paths:
      - 'src/features/deployment-strategies/**'
      - 'docs/features/deployment-strategies/**'
      - '.github/workflows/ci-deployment-strategies.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/deployment-strategies/**'
      - 'docs/features/deployment-strategies/**'
      - '.github/workflows/ci-deployment-strategies.yml'

concurrency:
  group: deployment-strategies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Architectural Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Vet
        run: go vet ./src/features/deployment-strategies/...

      - name: Run Feature Tests
        run: go test -v -race -timeout 120s ./src/features/deployment-strategies/...
