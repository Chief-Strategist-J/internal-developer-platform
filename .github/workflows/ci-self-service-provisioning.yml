name: CI — Self-Service Provisioning

on:
  push:
    branches: [main]
    paths:
      - 'src/features/self-service-provisioning/**'
      - 'deploy/k8s/base/apps/sweeper-cronjob.yaml'
      - 'deploy/k8s/base/observability/prometheus/**'
      - 'deploy/k8s/base/observability/grafana/**'
      - 'scripts/test/test.sweeper.sh'
      - '.github/workflows/ci-self-service-provisioning.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/self-service-provisioning/**'
      - 'deploy/k8s/base/apps/sweeper-cronjob.yaml'
      - 'deploy/k8s/base/observability/prometheus/**'
      - 'deploy/k8s/base/observability/grafana/**'
      - 'scripts/test/test.sweeper.sh'
      - '.github/workflows/ci-self-service-provisioning.yml'

jobs:
  test:
    name: Unit & Architectural Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Vet
        run: go vet ./src/features/self-service-provisioning/...

      - name: Run Feature Tests
        run: go test -v -race -timeout 120s ./src/features/self-service-provisioning/...

      - name: Validate Kubernetes Manifests
        run: |
          kubectl kustomize deploy/k8s/base/observability > /dev/null
          kubectl kustomize deploy/k8s/base/apps > /dev/null
          kubectl kustomize deploy/k8s/overlays/dev > /dev/null
