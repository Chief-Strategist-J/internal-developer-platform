name: CI — Platform Regime

on:
  push:
    branches: [main]
    paths:
      - 'src/features/platform-regime/**'
      - '.github/workflows/ci-platform-regime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/platform-regime/**'
      - '.github/workflows/ci-platform-regime.yml'

concurrency:
  group: regime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Platform Regime Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Vet
        run: go vet ./src/features/platform-regime/...

      - name: Run Feature Tests
        run: go test -v -race -timeout 120s ./src/features/platform-regime/...
