name: CI — Role-Based Access Control

on:
  push:
    branches: [main]
    paths:
      - 'src/features/role-based-access-control/**'
      - '.github/workflows/ci-role-based-access-control.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/role-based-access-control/**'
      - '.github/workflows/ci-role-based-access-control.yml'

jobs:
  test:
    name: RBAC Feature Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Vet
        run: go vet ./src/features/role-based-access-control/...

      - name: Run Feature Tests
        run: go test -v -race -timeout 120s ./src/features/role-based-access-control/...
