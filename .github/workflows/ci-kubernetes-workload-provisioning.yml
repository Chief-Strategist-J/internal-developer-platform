name: CI — Kubernetes Workload Provisioning

on:
  push:
    branches: [main]
    paths:
      - 'src/features/kubernetes-workload-provisioning/**'
      - '.github/workflows/ci-kubernetes-workload-provisioning.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/kubernetes-workload-provisioning/**'
      - '.github/workflows/ci-kubernetes-workload-provisioning.yml'

concurrency:
  group: k8s-workload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kubernetes Workload Provisioning Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Vet
        run: go vet ./src/features/kubernetes-workload-provisioning/...

      - name: Run Feature Tests
        run: go test -v -race -timeout 120s ./src/features/kubernetes-workload-provisioning/...
