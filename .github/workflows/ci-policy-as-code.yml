name: CI — Policy as Code

on:
  push:
    branches: [main]
    paths:
      - 'src/features/policy-as-code/**'
      - '.github/workflows/ci-policy-as-code.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/policy-as-code/**'
      - '.github/workflows/ci-policy-as-code.yml'

jobs:
  test:
    name: Policy as Code Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Vet
        run: go vet ./src/features/policy-as-code/...

      - name: Run Feature Tests
        run: go test -v -race -timeout 120s ./src/features/policy-as-code/...
