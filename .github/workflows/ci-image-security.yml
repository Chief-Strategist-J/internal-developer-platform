name: CI — Image Security

on:
  push:
    branches: [main]
    paths:
      - 'src/features/image-security/**'
      - '.github/workflows/ci-image-security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/image-security/**'
      - '.github/workflows/ci-image-security.yml'

concurrency:
  group: image-sec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Image Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Vet
        run: go vet ./src/features/image-security/...

      - name: Run Feature Tests
        run: go test -v -race -timeout 120s ./src/features/image-security/...
