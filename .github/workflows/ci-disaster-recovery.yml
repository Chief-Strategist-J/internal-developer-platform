name: CI — Disaster Recovery

on:
  push:
    branches: [main]
    paths:
      - 'src/features/disaster-recovery/**'
      - '.github/workflows/ci-disaster-recovery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/disaster-recovery/**'
      - '.github/workflows/ci-disaster-recovery.yml'

jobs:
  test:
    name: Disaster Recovery Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Vet
        run: go vet ./src/features/disaster-recovery/...

      - name: Run Feature Tests
        run: go test -v -race -timeout 120s ./src/features/disaster-recovery/...
