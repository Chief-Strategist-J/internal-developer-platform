name: CI — Service Catalog

on:
  push:
    branches: [main]
    paths:
      - 'src/features/service-catalog/**'
      - '.github/workflows/ci-service-catalog.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/service-catalog/**'
      - '.github/workflows/ci-service-catalog.yml'

jobs:
  test:
    name: Service Catalog Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Vet
        run: go vet ./src/features/service-catalog/...

      - name: Run Feature Tests
        run: go test -v -race -timeout 120s ./src/features/service-catalog/...
