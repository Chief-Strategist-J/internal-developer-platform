name: internal-developer-platform
language: go
structure_contract: 3.0.0
subsystems:
  contracts: [openapi]
  database: [postgres]
  messaging: []
  deploy: [docker, helm, k8s, argocd]
  frontend: false
process_roles: [api, worker, migrate]
features_registry: src/app/modules
owners: "@platform-core"
migration_phase: 5
migration_notes: |
  Phase 1 (baseline) done: .package-meta.yaml + violations.todo.yml created.
  Phase 2 (boundary enforcement) done: package-wide G-01/G-02/G-05/G-07/G-11/X-05/GO-INT-001/D-01/D-02 architecture tests.
  Phase 3 (location moves & Go internal/) done across all 10 active features: legacy offerings and DR CLI moved into features, compiler-enforced internal/ under all active Go features, and polyglot v3.0 layout applied to TS/Rust/C++.
  Phase 4 (cross-feature coupling removal) done: authz kernel capability + root-index-only X-03 bridges; zero Service() exports.
  Phase 5 (data ownership) done: database/engine moved to src/infra/db, database/roles.sql + schema.lock generated, and all migrations moved under src/features/{f}/database/migrations/.
