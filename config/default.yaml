server:
  name: "internal-developer-platform"
  port: 8080
  admin_port: 8081
  idle_timeout_seconds: 75
  header_timeout_seconds: 15
  drain_deadline_seconds: 15
  shutdown_deadline_seconds: 30

database:
  url: "postgres://postgres:postgres@127.0.0.1:5432/idp_db?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_minutes: 5

redis:
  address: "127.0.0.1:6379"
  timeout_seconds: 2

auth:
  jwt_secret: "platform-secure-jwt-signing-key-production"
  issuer: "internal-developer-platform"

kubernetes:
  endpoint: "https://k8s-api.internal:6443"

argocd:
  endpoint: "https://argocd.internal:443"
  token: ""

gcp:
  project_id: ""
  cloud_sql_admin_url: "https://sqladmin.googleapis.com/sql/v1beta4"
  cloud_dns_url: "https://dns.googleapis.com/dns/v1"

rbac:
  pagerduty_endpoint: ""
  pagerduty_api_token: ""
  jira_endpoint: ""
  jira_api_token: ""
  siem_webhook_url: ""
  siem_api_token: ""
  federation_hmac_secret: ""
  task_lease_hmac_secret: ""
  oidc_introspect_endpoint: ""
  oidc_client_id: ""
  oidc_client_secret: ""
  abac_allowed_start_hour_utc: 0
  abac_allowed_end_hour_utc: 24
  dev_staging_max_quota: 100

endpoints:
  base_path: "/api/v1"
