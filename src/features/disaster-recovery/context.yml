feature: disaster-recovery
type: backend
owners: "@platform-core"
status: active
aliases: []

provides: []
exposes: []

asks:
  - capability: authz
    reason: "Route authorization for DR plans, failovers, fencing, drills, and breakglass"
    fallback: fail-closed

events:
  produces: []
  consumes: []

projections: []

persistence:
  schema: disaster_recovery
  role: svc_disaster_recovery
  tenant_scoped: true
  data_classes:
    tenant_id: internal
    plan_name: internal
  erasure: none

ports:
  - name: repository
    adapters: [postgres, memory]
  - name: cloud-dr
    adapters: [cloud, gcp]

lifecycles:
  - name: readiness-prober
    roles: [worker]
    schedule: "*/1 * * * *"
    lease: false

ingress:
  rest: contracts/openapi/disaster-recovery/v1/openapi.yaml

tiers: [rules, machine, workflow]

deviations: []
waivers: []
