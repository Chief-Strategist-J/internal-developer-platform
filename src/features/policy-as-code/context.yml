feature: policy-as-code
type: backend
owners: "@platform-core"
status: active
aliases: []

provides: []
exposes:
  - GetActiveExceptionForWorkload

asks:
  - capability: authz
    reason: "Route authorization for policy CRUD, exceptions, and violation scans"
    fallback: fail-closed

events:
  produces: []
  consumes: []

projections: []

persistence:
  schema: policy_as_code
  role: svc_policy_as_code
  tenant_scoped: true
  data_classes:
    tenant_id: internal
    approver_id: internal
  erasure: none

ports:
  - name: repository
    adapters: [postgres, memory]

lifecycles: []

ingress:
  rest: contracts/openapi/policy-as-code/v1/openapi.yaml

tiers: [rules, machine, workflow]

deviations: []
waivers: []
