# context.yml — role-based-access-control feature (v3.0 schema, XI.1)
feature: role-based-access-control
type: backend
owners: "@platform-core"
status: active
aliases: []

provides: [authz]

exposes:
  - EvaluateTaskLease
  - EvaluateAsyncJobDrift
  - AuthenticateAndAuthorize
  - AuthenticateAndAuthorizeWithContext

asks: []

events:
  produces:
    - type: role-based-access-control.permission.granted.v1
      schema: contracts/asyncapi/role-based-access-control/v1/permission.granted.json
      retention: 90d
    - type: role-based-access-control.permission.denied.v1
      schema: contracts/asyncapi/role-based-access-control/v1/permission.denied.json
      retention: 90d
    - type: role-based-access-control.subject.revoked.v1
      schema: contracts/asyncapi/role-based-access-control/v1/subject.revoked.json
      retention: 90d
  consumes: []

projections: []

persistence:
  schema: role_based_access_control
  role: svc_rbac
  tenant_scoped: true
  data_classes:
    subject_id: internal
    tenant_id: internal
    role_name: internal
    decision: internal
  erasure: crypto-shredding

ports:
  - name: repository
    adapters: [postgres, redis, memory]
  - name: token-verifier
    adapters: [jwt]
  - name: revocation-store
    adapters: [redis, memory]
  - name: audit-outbox
    adapters: [postgres, memory]
  - name: unit-of-work
    adapters: [postgres]
  - name: sidecar-pdp
    adapters: [http]

lifecycles:
  - name: invalidation-listener
    roles: [api, worker]
  - name: prune-scheduler
    roles: [worker]
    schedule: "0 2 * * *"
    lease: true
  - name: streaming-reaper
    roles: [api]
  - name: audit-outbox-relay
    roles: [worker]

ingress:
  rest: contracts/openapi/role-based-access-control/v1/openapi.yaml

tiers: [rules, machine]

deviations: []
waivers: []
