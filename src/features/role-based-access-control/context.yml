feature: role-based-access-control
mode: backend
owner: platform-core
invariants:
  - P0-01 Default Deny: absence of policy or explicit DENY always rejects with 403
  - P0-02 Multi-Tenant Isolation: cross-tenant access requires explicit federation or PlatformAdmin without guardrail violation
  - P0-03 Immutable Audit Logging: ELEVATED_PERMIT halts if outbox fails; DENY writes local failover log if outbox fails
  - P1-04 Role Hierarchy DAG: cycles and depth > 5 rejected at definition time
  - Fail-closed Redis revocation: Redis errors reject authentication as 401
ports:
  - TokenVerifierPort (JWTTokenVerifierAdapter via github.com/golang-jwt/jwt/v5)
  - RevocationStorePort (RedisRevocationAdapter via github.com/redis/go-redis/v9)
  - AccessGrantRepositoryPort (PostgresRBACAdapter)
  - UserBindingRepositoryPort (PostgresRBACAdapter)
  - RBACAuditOutboxPort (PostgresRBACAuditOutboxAdapter)
entities:
  - name: rbac_user_bindings
    source_of_truth: db
    fields:
      - name: subject_id  type: varchar(128) null: no  constraint: PK
      - name: tenant_id   type: varchar(128) null: no  constraint: PK, RLS
      - name: role_name   type: varchar(64)  null: no  constraint: PK, FK rbac_roles(name)
      - name: version     type: bigint       null: no  default: 1
      - name: created_at  type: timestamptz  null: no  default: NOW()
      - name: updated_at  type: timestamptz  null: no  default: NOW()
  - name: rbac_audit_outbox
    source_of_truth: db
    fields:
      - name: id             type: varchar(128) null: no  constraint: PK, CHECK(id <> '')
      - name: tenant_id      type: varchar(128) null: no  constraint: CHECK(tenant_id <> ''), RLS
      - name: subject_id     type: varchar(255) null: no  constraint: CHECK(subject_id <> '')
      - name: decision       type: varchar(64)  null: no  constraint: CHECK IN ('PERMIT','DENY','ELEVATED_PERMIT')
inheritance_chain:
  - class: RBACService
    parents: []
    linearization: [RBACService]
    shared_ancestors: []
    ports: [TokenVerifierPort, RevocationStorePort, AccessGrantRepositoryPort, UserBindingRepositoryPort, RBACAuditOutboxPort]
