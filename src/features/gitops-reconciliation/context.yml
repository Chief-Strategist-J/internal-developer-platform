# context.yml — gitops-reconciliation feature (v3.0 schema, XI.1)
feature: gitops-reconciliation
type: backend
owners: "@platform-core"
status: active
aliases: []

provides: []
exposes: []

asks:
  - capability: authz
    reason: "Route authorization and task-execution lease guard before reconciliation dispatch"
    fallback: fail-closed

events:
  produces:
    - type: gitops-reconciliation.reconciliation.succeeded.v1
      schema: contracts/asyncapi/gitops-reconciliation/v1/reconciliation.succeeded.json
      retention: 90d
    - type: gitops-reconciliation.reconciliation.failed.v1
      schema: contracts/asyncapi/gitops-reconciliation/v1/reconciliation.failed.json
      retention: 90d
    - type: gitops-reconciliation.rollback.triggered.v1
      schema: contracts/asyncapi/gitops-reconciliation/v1/rollback.triggered.json
      retention: 90d
  consumes: []

projections: []

persistence:
  schema: gitops_reconciliation
  role: svc_gitops_reconciliation
  tenant_scoped: true
  data_classes:
    tenant_id: internal
    service_id: internal
    app_name: internal
  erasure: none

ports:
  - name: repository
    adapters: [postgres, memory]
  - name: argocd
    adapters: [http]
  - name: secret-mechanism
    adapters: [postgres, memory]
  - name: outbox
    adapters: [postgres, memory]
  - name: task-lease
    adapters: [bridge]

lifecycles:
  - name: outbox-relay
    roles: [worker]
    schedule: "*/1 * * * *"
    lease: false

ingress:
  rest: contracts/openapi/gitops-reconciliation/v1/openapi.yaml

tiers: [rules, machine, workflow]

deviations: []
waivers: []
