openapi: 3.1.0
info:
  title: internal-developer-platform API
  version: 1.0.0
paths:
  /api/v1/auth/token:
    post:
      summary: Issue RBAC authentication token
      operationId: issueAuthToken
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
      responses:
        '200':
          description: Token successfully issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTokenResponseWrapper'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      summary: Get caller identity from authentication context
      operationId: getCallerIdentity
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Caller identity returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallerIdentityResponseWrapper'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/revoke:
    post:
      summary: Revoke session or subject identity
      operationId: revokeSession
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
      responses:
        '200':
          description: Revocation acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponseWrapper'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/evaluate:
    post:
      summary: Evaluate RBAC authorization policy for subject
      operationId: evaluatePolicy
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatePolicyRequest'
      responses:
        '200':
          description: Policy evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatePolicyResponseWrapper'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/jit/grants:
    post:
      summary: Request Just-In-Time (JIT) access grant
      operationId: requestJITAccess
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessGrantRequest'
      responses:
        '201':
          description: JIT access grant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantRecordResponse'
        '400':
          description: Validation error or ceiling exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - nodes/proxy or unauthorized approver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List active JIT access grants
      operationId: listActiveGrants
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of active access grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantListResponse'
  /api/v1/auth/jit/grants/{id}/revoke:
    post:
      summary: Revoke active JIT access grant
      operationId: revokeJITAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Grant revocation acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponseWrapper'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reconciliations:
    get:
      summary: List GitOps reconciliations for tenant
      operationId: listGitOpsReconciliations
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
        - name: serviceId
          in: query
          required: false
          schema:
            type: string
        - name: syncPhase
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Reconciliation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      summary: Trigger GitOps reconciliation
      operationId: triggerGitOpsReconciliation
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
        - name: x-idempotency-key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCommand'
      responses:
        '202':
          description: Reconciliation initiated or idempotently resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResultResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict or transition error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reconciliations/{id}:
    get:
      summary: Get reconciliation status by ID
      operationId: getGitOpsReconciliation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reconciliation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRecordResponse'
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reconciliations/{id}/diff:
    get:
      summary: Inspect classified drift and ignored fields for a reconciliation
      operationId: getGitOpsReconciliationDiff
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed classified drift report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedDriftReportResponse'
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/webhooks/gitops:
    post:
      summary: Ingest GitOps webhook trigger from Git provider
      operationId: ingestGitOpsWebhook
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitOpsWebhookPayload'
      responses:
        '200':
          description: Webhook ingested and applications refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitOpsWebhookResultResponse'
        '401':
          description: Invalid HMAC signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/gitops/secrets/validate:
    post:
      summary: Validate secret manifest against D-SEC GitOps path policy (P0-03)
      operationId: validateGitOpsSecretManifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - mechanism
              properties:
                mechanism:
                  type: string
                  enum:
                    - SEALED_SECRETS
                    - EXTERNAL_SECRETS_OPERATOR
                    - SECRETS_STORE_CSI_DRIVER
                hasPlaintextData:
                  type: boolean
                pluginInjectsValues:
                  type: boolean
      responses:
        '200':
          description: Secret manifest allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Secret manifest blocked by P0-03
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/gitops/fleet/rollout:
    post:
      summary: Execute Phase 3 multi-cluster fleet ring rollout
      operationId: executeGitOpsFleetRollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - appName
                - targetRevision
                - targets
              properties:
                tenantId:
                  type: string
                appName:
                  type: string
                targetRevision:
                  type: string
                targets:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      clusterName:
                        type: string
                      ring:
                        type: string
                        enum:
                          - CANARY
                          - STAGING
                          - PROD_WAVE_1
                          - PROD_WAVE_2
                      namespace:
                        type: string
                      projectName:
                        type: string
      responses:
        '200':
          description: Fleet ring rollout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          description: Fleet ring rollout halted on degraded cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/gitops/secrets/config:
    get:
      summary: Get configured destination-cluster secret mechanism (D-SEC)
      operationId: getGitOpsSecretConfig
      responses:
        '200':
          description: Configured secret mechanism
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Configure destination-cluster secret mechanism (D-SEC)
      operationId: configureGitOpsSecretConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - mechanism
              properties:
                tenantId:
                  type: string
                mechanism:
                  type: string
                  enum:
                    - SEALED_SECRETS
                    - EXTERNAL_SECRETS_OPERATOR
                    - SECRETS_STORE_CSI_DRIVER
                vaultEndpoint:
                  type: string
                clusterScope:
                  type: string
                secretStoreRef:
                  type: string
                csiDriverName:
                  type: string
                encryptionKeyRef:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: Secret mechanism configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workloads:
    post:
      summary: Provision Kubernetes Workload
      operationId: provisionKubernetesWorkload
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
        - name: x-idempotency-key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadProvisionCommand'
      responses:
        '201':
          description: Workload admitted and provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadProvisionResultResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict or transition error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workloads/{id}:
    get:
      summary: Get workload provision by ID
      operationId: getKubernetesWorkload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workload details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadProvisionRecordResponse'
        '404':
          description: Workload not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/services:
    post:
      summary: Register a service in the catalog
      operationId: registerService
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterServiceInput'
      responses:
        '201':
          description: Service successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDescriptorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /healthz:
    get:
      summary: Liveness probe
      operationId: checkLiveness
      responses:
        '200':
          description: Healthy
  /readyz:
    get:
      summary: Readiness probe
      operationId: checkReadiness
      responses:
        '200':
          description: Ready
  /api/v1/regimes:
    post:
      summary: Register and activate platform regime policy (B-1 to B-4)
      operationId: registerRegimePolicy
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegimePolicyRequest'
      responses:
        '201':
          description: Regime policy successfully registered and activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegimePolicyResponseWrapper'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/regimes/active:
    get:
      summary: Get active platform regime policy for tenant
      operationId: getActiveRegimePolicy
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Active regime policy returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegimePolicyResponseWrapper'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dr/plans:
    post:
      summary: Create Disaster Recovery Plan
      operationId: createDRPlan
      parameters:
        - name: traceparent
          in: header
          required: true
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - planName
                - incidentTier
                - primaryRegion
                - drRegion
                - topology
                - targetRtoSeconds
                - targetRpoSeconds
                - dataStoreType
                - secretSyncSource
                - primaryClusterId
                - drClusterId
                - idempotencyKey
              properties:
                tenantId:
                  type: string
                planName:
                  type: string
                incidentTier:
                  type: string
                  enum: [TIER_0, TIER_1, TIER_2, TIER_3]
                primaryRegion:
                  type: string
                drRegion:
                  type: string
                topology:
                  type: string
                  enum: [ACTIVE_ACTIVE, WARM_STANDBY, PILOT_LIGHT, RESTORE_TO_NEW]
                targetRtoSeconds:
                  type: integer
                targetRpoSeconds:
                  type: integer
                dataStoreType:
                  type: string
                  enum: [CLOUD_SQL, ALLOYDB, SPANNER, SELF_MANAGED]
                secretSyncSource:
                  type: string
                  enum: [GOOGLE_SECRET_MANAGER, VAULT_REPLICATED]
                primaryClusterId:
                  type: string
                drClusterId:
                  type: string
                idempotencyKey:
                  type: string
      responses:
        '201':
          description: DR Plan Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DRPlanResponseWrapper'
    get:
      summary: List Disaster Recovery Plans
      operationId: listDRPlans
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of DR Plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/v1/dr/plans/{plan}:
    get:
      summary: Get Disaster Recovery Plan by ID or Name
      operationId: getDRPlan
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DR Plan Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DRPlanResponseWrapper'

  /api/v1/dr/plans/{plan}:checkReadiness:
    post:
      summary: Check DR Plan Readiness Probes
      operationId: checkDRPlanReadiness
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Readiness Probe Results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/v1/dr/plans/{plan}/rpo:
    get:
      summary: Get Live RPO Replication Lag
      operationId: getDRPlanRPO
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Live RPO Metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/v1/dr/incidents:declare:
    post:
      summary: Declare Disaster Recovery Incident
      operationId: declareDRIncident
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - planId
                - scope
                - declarer
              properties:
                tenantId:
                  type: string
                planId:
                  type: string
                scope:
                  type: string
                  enum: [ZONE, REGION, PROVIDER_GLOBAL, DATA_CORRUPTION, SECURITY_COMPROMISE]
                declarer:
                  type: string
                evidenceLinks:
                  type: array
                  items:
                    type: string
      responses:
        '202':
          description: Incident Declared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/v1/dr/incidents/{incident}:approve:
    post:
      summary: Approve Disaster Recovery Incident (Two-Person Quorum)
      operationId: approveDRIncident
      parameters:
        - name: incident
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - approver
              properties:
                tenantId:
                  type: string
                incidentId:
                  type: string
                approver:
                  type: string
      responses:
        '200':
          description: Incident Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/v1/dr/failovers:
    post:
      summary: Initiate Stateful Disaster Recovery Failover
      operationId: initiateDRFailover
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - planId
                - incidentId
                - mode
                - initiator
              properties:
                tenantId:
                  type: string
                planId:
                  type: string
                incidentId:
                  type: string
                mode:
                  type: string
                  enum: [SWITCHOVER, REPLICA_FAILOVER]
                initiator:
                  type: string
      responses:
        '202':
          description: Failover Initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/v1/dr/failovers/{op}:
    get:
      summary: Get Failover Operation Status
      operationId: getDRFailover
      parameters:
        - name: op
          in: path
