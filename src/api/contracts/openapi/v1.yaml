        - name
        - owner
        - lifecycle
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        owner:
          type: string
        lifecycle:
          type: string
    ServiceDescriptor:
      type: object
      additionalProperties: false
      required:
