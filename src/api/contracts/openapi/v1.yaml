components:

  schemas:
    Permission:
      type: object
      additionalProperties: false
      required:
        - resource
        - action
      properties:
        resource:
          type: string
        action:
          type: string
    IssueTokenRequest:
      type: object
      additionalProperties: false
      required:
        - subjectId
        - tenantId
        - roles
      properties:
        subjectId:
          type: string
        tenantId:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        ttlSeconds:
          type: integer
    IssueTokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - subjectId
        - tenantId
        - roles
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
        subjectId:
          type: string
        tenantId:
          type: string
        roles:
          type: array
          items:
            type: string
    CallerIdentityResponse:
      type: object
      additionalProperties: false
      required:
        - subjectId
        - tenantId
        - roles
        - issuer
        - expiresAt
      properties:
        subjectId:
          type: string
        tenantId:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        issuer:
          type: string
        expiresAt:
          type: string
    RevokeSessionRequest:
      type: object
      additionalProperties: false
      properties:
        subjectId:
          type: string
        jti:
          type: string
        reason:
          type: string
