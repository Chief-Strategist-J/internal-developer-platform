openapi: 3.1.0
info:
  title: internal-developer-platform API
  version: 1.0.0
paths:
  /api/v1/auth/token:
    post:
      summary: Issue RBAC authentication token
      operationId: issueAuthToken
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
      responses:
        '200':
          description: Token successfully issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTokenResponseWrapper'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      summary: Get caller identity from authentication context
      operationId: getCallerIdentity
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Caller identity returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallerIdentityResponseWrapper'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/revoke:
    post:
      summary: Revoke session or subject identity
      operationId: revokeSession
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
      responses:
        '200':
          description: Revocation acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponseWrapper'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/evaluate:
    post:
      summary: Evaluate RBAC authorization policy for subject
      operationId: evaluatePolicy
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatePolicyRequest'
      responses:
        '200':
          description: Policy evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatePolicyResponseWrapper'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/jit/grants:
    post:
      summary: Request Just-In-Time (JIT) access grant
      operationId: requestJITAccess
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessGrantRequest'
      responses:
        '201':
          description: JIT access grant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantRecordResponse'
        '400':
          description: Validation error or ceiling exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - nodes/proxy or unauthorized approver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List active JIT access grants
      operationId: listActiveGrants
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of active access grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantListResponse'
  /api/v1/auth/jit/grants/{id}/revoke:
    post:
      summary: Revoke active JIT access grant
      operationId: revokeJITAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Grant revocation acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponseWrapper'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reconciliations:
    post:
      summary: Trigger GitOps reconciliation
      operationId: triggerGitOpsReconciliation
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
        - name: x-idempotency-key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCommand'
      responses:
        '202':
          description: Reconciliation initiated or idempotently resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResultResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict or transition error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reconciliations/{id}:
    get:
      summary: Get reconciliation status by ID
      operationId: getGitOpsReconciliation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reconciliation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRecordResponse'
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workloads:
    post:
      summary: Provision Kubernetes Workload
      operationId: provisionKubernetesWorkload
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
        - name: x-idempotency-key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadProvisionCommand'
      responses:
        '201':
          description: Workload admitted and provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadProvisionResultResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict or transition error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workloads/{id}:
    get:
      summary: Get workload provision by ID
      operationId: getKubernetesWorkload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workload details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadProvisionRecordResponse'
        '404':
          description: Workload not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/services:
    post:
      summary: Register a service in the catalog
      operationId: registerService
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterServiceInput'
      responses:
        '201':
          description: Service successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDescriptorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /healthz:
    get:
      summary: Liveness probe
      operationId: checkLiveness
      responses:
        '200':
          description: Healthy
  /readyz:
    get:
      summary: Readiness probe
      operationId: checkReadiness
      responses:
        '200':
          description: Ready
components:
  schemas:
    Permission:
      type: object
      additionalProperties: false
      required:
        - resource
        - action
      properties:
        resource:
          type: string
        action:
          type: string
    IssueTokenRequest:
      type: object
      additionalProperties: false
      required:
        - subjectId
        - tenantId
        - roles
      properties:
        subjectId:
          type: string
        tenantId:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        ttlSeconds:
          type: integer
    IssueTokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - subjectId
        - tenantId
        - roles
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
        subjectId:
          type: string
        tenantId:
          type: string
        roles:
          type: array
          items:
            type: string
    CallerIdentityResponse:
      type: object
      additionalProperties: false
      required:
        - subjectId
        - tenantId
        - roles
        - issuer
        - expiresAt
      properties:
        subjectId:
          type: string
        tenantId:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        issuer:
          type: string
        expiresAt:
          type: string
    RevokeSessionRequest:
      type: object
      additionalProperties: false
      properties:
        subjectId:
          type: string
        jti:
          type: string
        reason:
          type: string
    RevokeSessionResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
    EvaluatePolicyRequest:
      type: object
      additionalProperties: false
      required:
        - targetTenantId
        - resource
        - action
      properties:
        targetTenantId:
          type: string
        resource:
          type: string
        action:
          type: string
    EvaluationResult:
      type: object
      additionalProperties: false
      required:
        - granted
        - reason
      properties:
        granted:
          type: boolean
        reason:
          type: string
    SyncCommand:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - serviceId
        - appName
        - targetRevision
        - idempotencyKey
      properties:
        id:
          type: string
        tenantId:
          type: string
        serviceId:
          type: string
        appName:
          type: string
        targetRevision:
          type: string
        prune:
          type: boolean
        dryRun:
          type: boolean
        idempotencyKey:
          type: string
    ReconciliationRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - serviceId
        - appName
        - targetRevision
        - currentRevision
        - syncPhase
        - healthStatus
        - idempotencyKey
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        serviceId:
          type: string
        appName:
          type: string
        targetRevision:
          type: string
        currentRevision:
          type: string
        syncPhase:
          type: string
          enum: [PENDING, SYNCING, SYNCED, FAILED, DRIFT_DETECTED]
        healthStatus:
          type: string
          enum: [HEALTHY, PROGRESSING, DEGRADED, MISSING, UNKNOWN]
        idempotencyKey:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SyncResult:
      type: object
      additionalProperties: false
      required:
        - reconciliation
        - appliedHooks
        - message
      properties:
        reconciliation:
          $ref: '#/components/schemas/ReconciliationRecord'
        appliedHooks:
          type: integer
        message:
          type: string
    RegisterServiceInput:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - name
        - owner
        - lifecycle
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        owner:
          type: string
        lifecycle:
          type: string
    ServiceDescriptor:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - name
        - owner
        - lifecycle
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        owner:
          type: string
        lifecycle:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, DEPRECATED, RETIRED]
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SecretVolumeMount:
      type: object
      additionalProperties: false
      required:
        - volumeName
        - secretName
        - mountPath
      properties:
        volumeName:
          type: string
        secretName:
          type: string
        mountPath:
          type: string
        subPath:
          type: string
        readOnly:
          type: boolean
    MeshSecurityConfig:
      type: object
      additionalProperties: false
      required:
        - mtlsMode
      properties:
        mtlsMode:
          type: string
          enum: [STRICT, PERMISSIVE, DISABLE]
        allowedPrincipals:
          type: array
          items:
            type: string
        allowedMethods:
          type: array
          items:
            type: string
    EgressRule:
      type: object
      additionalProperties: false
      required:
        - host
        - port
        - protocol
      properties:
        host:
          type: string
        port:
          type: integer
        protocol:
          type: string
    AuditLoggingConfig:
      type: object
      additionalProperties: false
      properties:
        enableDataAccessLogs:
          type: boolean
        destinationBucket:
          type: string
        retentionDays:
          type: integer
        lockedRetention:
          type: boolean
        kmsKeyUri:
          type: string
        offNodeLogCollection:
          type: boolean
        piiScrubbingEnabled:
          type: boolean
    WorkloadProvisionCommand:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - serviceId
        - namespace
        - workloadName
        - image
        - cpuRequest
        - cpuLimit
        - memoryRequest
        - memoryLimit
        - replicas
        - idempotencyKey
      properties:
        id:
          type: string
        publicId:
          type: string
        tenantId:
          type: string
        source:
          type: string
        externalId:
          type: string
        correlationId:
          type: string
        serviceId:
          type: string
        namespace:
          type: string
        workloadName:
          type: string
        image:
          type: string
        imagePullPolicy:
          type: string
        breakglassJustification:
          type: string
        cpuRequest:
          type: string
        cpuLimit:
          type: string
        memoryRequest:
          type: string
        memoryLimit:
          type: string
        replicas:
          type: integer
          minimum: 1
          maximum: 100
        strategy:
          type: string
          enum: [CANARY, ROLLING_UPDATE, BLUE_GREEN]
        idempotencyKey:
          type: string
        approvedSpecHash:
          type: string
        approverRole:
          type: string
        secretMounts:
          type: array
          items:
            $ref: '#/components/schemas/SecretVolumeMount'
        kmsKeyUri:
          type: string
        encryptedSecrets:
          type: object
          additionalProperties:
            type: string
        tlsHosts:
          type: array
          items:
            type: string
        meshSecurity:
          $ref: '#/components/schemas/MeshSecurityConfig'
        unsupportedMeshResources:
          type: array
          items:
            type: string
        egressRules:
          type: array
          items:
            $ref: '#/components/schemas/EgressRule'
        auditLogging:
          $ref: '#/components/schemas/AuditLoggingConfig'
    WorkloadProvisionRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - serviceId
        - namespace
        - workloadName
        - cpuRequest
        - cpuLimit
        - memoryRequest
        - memoryLimit
        - replicas
        - status
        - idempotencyKey
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        publicId:
          type: string
        tenantId:
          type: string
        source:
          type: string
        externalId:
          type: string
        correlationId:
          type: string
        specHash:
          type: string
        approvedSpecHash:
          type: string
        approverRole:
          type: string
        imagePullPolicy:
          type: string
        breakglassJustification:
          type: string
        serviceId:
          type: string
        namespace:
          type: string
        workloadName:
          type: string
        cpuRequest:
          type: string
        cpuLimit:
          type: string
        memoryRequest:
          type: string
        memoryLimit:
          type: string
        replicas:
          type: integer
        strategy:
          type: string
        status:
          type: string
          enum: [SUBMITTED, VALIDATED, ADMITTED, ACTIVE, REJECTED]
        enableDataAccessLogs:
          type: boolean
        auditDestinationBucket:
          type: string
        auditRetentionDays:
          type: integer
        auditLockedRetention:
          type: boolean
        idempotencyKey:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkloadProvisionResult:
      type: object
      additionalProperties: false
      required:
        - provision
        - injectedSecurityContext
        - injectedProbes
        - pdbCreated
        - message
      properties:
        provision:
          $ref: '#/components/schemas/WorkloadProvisionRecord'
        injectedSecurityContext:
          type: boolean
        injectedProbes:
          type: boolean
        pdbCreated:
          type: boolean
        message:
          type: string
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - timestamp
        - executionTimeMs
        - apiVersion
      properties:
        requestId:
          type: string
        correlationId:
          type: string
        causationId:
          type: string
        timestamp:
          type: string
          format: date-time
        executionTimeMs:
          type: integer
        apiVersion:
          type: string
    ResponseErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - issue
        - rule
      properties:
        field:
          type: string
        issue:
          type: string
        rule:
          type: string
        rejectedValue:
          nullable: true
    ResponseError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: '#/components/schemas/ResponseErrorDetail'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - statusCode
        - error
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        error:
          $ref: '#/components/schemas/ResponseError'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SyncResultResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - statusCode
        - data
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          $ref: '#/components/schemas/SyncResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ReconciliationRecordResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - statusCode
        - data
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          $ref: '#/components/schemas/ReconciliationRecord'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ServiceDescriptorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - statusCode
        - data
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          $ref: '#/components/schemas/ServiceDescriptor'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    WorkloadProvisionResultResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - statusCode
        - data
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          $ref: '#/components/schemas/WorkloadProvisionResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    WorkloadProvisionRecordResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - statusCode
        - data
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          $ref: '#/components/schemas/WorkloadProvisionRecord'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    IssueTokenResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - success
        - statusCode
        - data
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          $ref: '#/components/schemas/IssueTokenResponse'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CallerIdentityResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - success
        - statusCode
        - data
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          $ref: '#/components/schemas/CallerIdentityResponse'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
