      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
    EvaluatePolicyRequest:
      type: object
      additionalProperties: false
      required:
        - targetTenantId
        - resource
        - action
      properties:
        targetTenantId:
          type: string
        resource:
          type: string
        action:
          type: string
    EvaluationResult:
      type: object
      additionalProperties: false
      required:
        - granted
        - reason
      properties:
        granted:
          type: boolean
        reason:
          type: string
    SyncCommand:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - serviceId
        - appName
        - targetRevision
        - idempotencyKey
      properties:
        id:
          type: string
        tenantId:
          type: string
        serviceId:
          type: string
        appName:
          type: string
        targetRevision:
          type: string
        prune:
          type: boolean
        dryRun:
          type: boolean
        idempotencyKey:
          type: string
    ReconciliationRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - serviceId
        - appName
        - targetRevision
        - currentRevision
        - syncPhase
        - healthStatus
        - idempotencyKey
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        serviceId:
          type: string
        appName:
          type: string
        targetRevision:
          type: string
        currentRevision:
          type: string
        syncPhase:
          type: string
          enum: [PENDING, SYNCING, SYNCED, FAILED, DRIFT_DETECTED]
        healthStatus:
          type: string
          enum: [HEALTHY, PROGRESSING, DEGRADED, MISSING, UNKNOWN]
        idempotencyKey:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SyncResult:
      type: object
      additionalProperties: false
      required:
